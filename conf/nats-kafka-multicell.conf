#
# Example configuration file for the nats-kafka bridge consuming from
# multiple NATS clusters (cells) with a single deployment.
#

# The interval to wait to reconnect
reconnectinterval: 5000,

# The global connection timeout
connecttimeout: 5000,

# Logging options
logging: {
  time: true,
  debug: false,
  trace: false,
  colors: true,
  pid: false,
}

monitoring: {
  httpport: 9222,
}

# The default NATS cluster, used by connectors without a natsconnection.
# In multi-cluster deployments set maxreconnects to -1 so the NATS clients
# keep retrying while a cell is unreachable.
nats: {
  Servers: ["nats://cell-a:4222"],
  ConnectTimeout: 5000,
  MaxReconnects: -1,
  ReconnectWait: 5000,
}

# Additional named NATS clusters (cells). Each entry accepts the same
# properties as the nats block plus a required name. Timeouts and client
# name default to the values from the nats block.
natsclusters: [
  {
    name: "cell-b",
    servers: ["nats://cell-b:4222"],
  },
  {
    name: "cell-c",
    servers: ["nats://cell-c:4222"],
    # usercredentials: "/etc/nats/cell-c.creds",
    # tls: {
    #   root: "/etc/nats/cell-c-ca.pem",
    # },
  },
]

#
# Consume the same subject from three cells and write everything to a
# single brand topic. The natsconnection property picks the cluster,
# connectors without it use the default nats block.
#
connect: [
  {
      type: "NATSToKafka",
      brokers: ["localhost:9092"],
      id: "TelemetryCellA",
      topic: "brand.telemetry",
      subject: "telemetry.>",
  },{
      type: "NATSToKafka",
      natsconnection: "cell-b",
      brokers: ["localhost:9092"],
      id: "TelemetryCellB",
      topic: "brand.telemetry",
      subject: "telemetry.>",
  },{
      type: "JetStreamToKafka",
      natsconnection: "cell-c",
      brokers: ["localhost:9092"],
      id: "TelemetryCellC",
      topic: "brand.telemetry",
      subject: "telemetry.>",
      stream: "TELEMETRY",
      durablename: "nats-kafka-cell-c",
  },
],
