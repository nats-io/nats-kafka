#
# Local validation config for the multicell bridge.
# Pairs with resources/local_multicell.yml (make setup-local-multicell),
# which starts Kafka on localhost:9192 and two JetStream-enabled NATS
# servers: cell-a on localhost:4222 and cell-b on localhost:4223.
# See HOWTO.md for the full validation runbook.
#

# The interval to wait to reconnect
reconnectinterval: 5000,

# The global connection timeout
connecttimeout: 5000,

# Logging options
logging: {
  time: true,
  debug: false,
  trace: false,
  colors: true,
  pid: false,
}

monitoring: {
  httpport: 9222,
}

# The default NATS cluster (cell-a), used by connectors without a
# natsconnection. In multi-cluster deployments set maxreconnects to -1
# so the NATS clients keep retrying while a cell is unreachable.
nats: {
  Servers: ["nats://localhost:4222"],
  ConnectTimeout: 5000,
  MaxReconnects: -1,
  ReconnectWait: 5000,
}

# Additional named NATS clusters (cells).
natsclusters: [
  {
    name: "cell-b",
    servers: ["nats://localhost:4223"],
  },
]

# JetStream settings shared by the JetStream connectors.
jetstream: {
  maxwait: 5000,
}

#
# Consume the TELEMETRY stream from both cells and write everything to a
# single brand topic. The natsconnection property picks the cluster,
# connectors without it use the default nats block.
#
connect: [
  {
      type: "JetStreamToKafka",
      brokers: ["localhost:9192"],
      id: "TelemetryCellA",
      topic: "brand.telemetry",
      subject: "telemetry.>",
      stream: "TELEMETRY",
      durablename: "nats-kafka-cell-a",
  },{
      type: "JetStreamToKafka",
      natsconnection: "cell-b",
      brokers: ["localhost:9192"],
      id: "TelemetryCellB",
      topic: "brand.telemetry",
      subject: "telemetry.>",
      stream: "TELEMETRY",
      durablename: "nats-kafka-cell-b",
  },
],
